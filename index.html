  { cat: '介面與畫面', title: '移除倒逆反色效果', gk: '倒逆著色', m: ['倒逆著色'] },
  { cat: '介面與畫面', title: '去除角色髒污', gk: '去除汙垢', m: ['去除汙垢', '去除污垢'] },
  { cat: '介面與畫面', title: '過場動畫解除 30 幀', gk: '過場動畫', m: ['過場動畫'] },
  { cat: '介面與畫面', title: '效能優化設定檔', gk: '提升幀率', m: ['提升幀率'], flag: '依顯示卡選預設' },

  { cat: 'MOD 管理器', title: 'Vortex 管理器', gk: 'Vortex', m: ['Vortex'], flag: '建議官網下載' },
  { cat: 'MOD 管理器', title: 'Vortex 中文化', gk: '漢化安裝腳本', m: ['漢化安裝腳本'] },
  { cat: 'MOD 管理器', title: 'Vortex 遊戲擴充', gk: '33號拓展', m: ['33號拓展'] },
  { cat: 'MOD 管理器', title: '.NET 6 執行環境', gk: 'windowsdesktop-runtime', m: ['windowsdesktop-runtime'], flag: '建議官網下載' },
  { cat: 'MOD 管理器', title: 'Gloss 管理器', gk: 'Gloss管理器', m: ['Gloss管理器'] },

  { cat: '作弊與修改器', title: 'Cheat Engine 7.5', gk: 'Cheat Engine', m: ['Cheat Engine'], flag: '建議官網下載' },
  { cat: '作弊與修改器', title: '自動格擋腳本', gk: '.ct', m: ['.ct'], flag: '搭配 Cheat Engine' },
  { cat: '作弊與修改器', title: '外置修改器 Plus 33', gk: '修改器', m: ['外置修改器', '修改器.rar'], flag: '高風險' },
  { cat: '作弊與修改器', title: '修改器最新版', gk: '修改器最新版', m: ['修改器最新版'], flag: '高風險' },

  { cat: '其他', title: '整合包本體 2.11', gk: '整合包2.11', m: ['整合包2.11'] },
];
/* 說明檔的內容已寫進對應工具的教學，不另外列出 */
const TOOL_HIDE = ['使用說明與替換存檔方法', '手動安裝教程', '說明.txt', '有問題聯繫客服'];
const TOOL_EXTRA = {
  '全服裝初始存檔': '整合包附的「使用說明與替換存檔方法」內容已整合在這份教學裡。',
  'NG33 完美存檔': '整合包附的「使用說明與替換存檔方法」內容已整合在這份教學裡。',
  '完美開局存檔': '整合包附的「使用說明與替換存檔方法」內容已整合在這份教學裡。',
  '自動格擋腳本': '整合包附的說明檔提醒：Cheat Engine 和腳本的路徑要改成英文，中文路徑可能會報錯。',
  'Vortex 中文化': '腳本失敗時的手動方法：按 Win + R 輸入 %appdata%\\vortex，建立 locales 資料夾，把 zh 資料夾放進去，再到 Vortex 的 SETTINGS → INTERFACE → LANGUAGE 選中文。',
};

/* 收集所有來源檔案，對應到工具項目 */
const TOOLS = TOOL_DEFS.map(d => ({ ...d, sources: [] }));
(() => {
  const raw = [];
  ['saves', 'tools', 'trainer', 'init', 'perf'].forEach(cat => P2[cat].forEach(r => raw.push({ name: r.path.split('/').pop(), path: r.path, size: fmtSize(r.size), link: r.link, from: '整合包' })));
  PACK.filter(g => !/服裝/.test(g.name)).forEach(g => g.items.forEach(it => raw.push({ name: it.n, path: g.path, size: it.size, link: g.link, from: '賣家 2026 更新' })));
  raw.forEach(r => {
    if (TOOL_HIDE.some(h => r.name.includes(h))) return;
    const t = TOOLS.find(d => d.m.some(p => r.name.includes(p))) || TOOLS.find(d => d.m.some(p => r.path.includes(p)));
    if (t) t.sources.push(r); else TOOLS.push({ cat: '其他', title: r.name, gk: r.name, m: [], sources: [r] });
  });
})();
const toolGuide = t => GUIDES.find(g => g.k.includes(t.gk)) || guideFor(t.gk) || { about: '這個檔案沒有額外說明。', steps: [], notes: [] };
function toolHTML(t) {
  const i = TOOLS.indexOf(t);
  const from = [...new Set(t.sources.map(s => s.from))].join('、');
  const size = t.sources.length > 1 ? `${t.sources.length} 個檔案` : (t.sources[0] ? t.sources[0].size : '');
  const risky = t.cat === '作弊與修改器';
  return `<button class="pk" data-tool="${i}"><span class="ic">${PACK_ICON}</span><span class="txt"><b>${esc(t.title)}</b><i>${t.flag ? `<span class="tag${risky ? ' tagwarn' : ''}">${esc(t.flag)}</span>` : ''}${esc(from)}</i></span><span class="sz">${esc(size)}</span></button>`;
}
function openTool(i) {
  const t = TOOLS[i], g = toolGuide(t);
  const notes = [...g.notes, ...(TOOL_EXTRA[t.title] ? [TOOL_EXTRA[t.title]] : [])];
  openSheet(`
    <div class="label">${esc(t.cat)}${t.flag ? ' · ' + esc(t.flag) : ''}</div>
    <h3>${esc(t.title)}</h3>
    <p class="desc">${esc(g.about)}</p>
    ${g.steps.length ? `<div class="label">安裝教學</div><ol class="install">${g.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}
    ${notes.map(n => `<p class="desc"><b class="warnb">注意：</b>${esc(n)}</p>`).join('')}
    <div class="label">檔案下載</div>
    <div class="rows">${t.sources.map(s => `<div class="row"><span class="ic">${ICON.dl}</span><span class="v"><span>${s.link ? `<a href="${s.link}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name)}</span><span class="label">${esc(s.from)} · ${esc(s.size)}</span></span></div>`).join('')}</div>
  `, { close: 'back' });
}
const toolsIn = c => TOOLS.filter(t => c === '全部' || t.cat === c);
function renderPack() {
  const cats = state.toolCat === '全部' ? TOOL_CATS : [state.toolCat];
  $('pack').innerHTML = cats.map(c => [c, toolsIn(c)]).filter(([, l]) => l.length).map(([c, l]) => `<div class="pagehead">${esc(c)} · ${l.length}</div>${l.map(toolHTML).join('')}`).join('')
    + `<p class="note">連結：整合包的檔案在你自己的雲端（<a class="dl" href="${P2.root}" target="_blank" rel="noopener">開啟整個資料夾</a>），賣家 2026 更新的檔案在賣家雲端。同一個工具有多個來源時合併成一項，點開可以看到每個檔案。</p>`;
  $('status').textContent = `${state.toolCat === '全部' ? '所有分類' : state.toolCat} · ${toolsIn(state.toolCat).length} 項`;
}

function setView(v) {
  state.view = v; save();
  const pack = v === 'pack';
  $('tabMods').setAttribute('aria-selected', !pack);
  $('tabPack').setAttribute('aria-selected', pack);
  $('list').hidden = pack; $('pack').hidden = !pack;
  $('pageBtn').hidden = pack;
  $('filterBtn').setAttribute('aria-label', pack ? '依分類篩選' : '依角色篩選');
  window.scrollTo({ top: 0 });
  if (pack) renderPack(); else render();
}
$('tabMods').addEventListener('click', () => setView('mods'));
$('tabPack').addEventListener('click', () => setView('pack'));

function render() {
  const list = ALL.filter(a => (state.src === '全部' || a.src === state.src) && matchWho(a, state.who));
  const groups = (state.who === '全部' ? CHARS : [state.who]).map(w => [w, list.filter(a => state.who === '全部' ? a.who.includes(w) : true)]).filter(([, l]) => l.length);
  const bySlot = l => [...SLOT_ORDER, ...new Set(l.map(a => a.slot).filter(s => !SLOT_ORDER.includes(s)))].map(s => [s, l.filter(a => a.slot === s)]).filter(([, x]) => x.length);
  $('list').innerHTML = groups.map(([w, l]) => `<div class="charhead">${esc(w)} · ${l.length}</div>${bySlot(l).map(([s, x]) => `<div class="pagehead">${esc(s)} · ${x.length}${x.length > 1 && s !== '未標示' && s !== '全部' ? ' · 一次只能裝一個' : ''}</div>${x.map(itemHTML).join('')}`).join('')}`).join('') || '<div class="empty">這個條件下沒有 MOD</div>';
  $('pageBtn').textContent = state.src === '全部' ? '全部來源' : state.src;
  $('status').textContent = `${state.who === '全部' ? '所有角色' : state.who} · ${list.length} 個`;
}

/* 封面輪播：取每頁第一個 MOD */
const heroMods = [1, 2, 3, 4, 5, 6].map(p => MODS.find(m => m.page === p && m.imgs.length));
let heroIdx = 0, heroTimer;
function showHero(i) {
  heroIdx = (i + heroMods.length) % heroMods.length;
  const m = heroMods[heroIdx];
  $('heroImg').src = m.imgs[0].src;
  $('heroImg').alt = m.title;
  $('heroT').textContent = '▍' + m.title;
  $('heroP').textContent = m.desc;
  [...$('dots').children].forEach((d, k) => d.setAttribute('aria-current', k === heroIdx));
}
$('dots').innerHTML = heroMods.map((m, k) => `<button aria-label="第 ${k + 1} 張"></button>`).join('');
$('dots').addEventListener('click', e => { const k = [...$('dots').children].indexOf(e.target); if (k >= 0) { showHero(k); restartHero(); } });
function restartHero() { clearInterval(heroTimer); if (!matchMedia('(prefers-reduced-motion: reduce)').matches) heroTimer = setInterval(() => showHero(heroIdx + 1), 5000); }
$('hero').addEventListener('click', () => openMod(heroMods[heroIdx].n));
$('hero').style.cursor = 'pointer';

/* 面板 */
function openSheet(html, { full = false, close = 'x', extra = '' } = {}) {
  $('sheetBody').innerHTML = html;
  $('sheetBody').scrollTop = 0;
  $('sheetExtra').innerHTML = extra;
  $('closeBtn').innerHTML = ICON[close];
  $('sheet').classList.toggle('full', full);
  $('scrim').hidden = false; $('sheet').hidden = false;
  requestAnimationFrame(() => { $('scrim').classList.add('on'); $('sheet').classList.add('on'); });
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  $('scrim').classList.remove('on'); $('sheet').classList.remove('on');
  document.body.style.overflow = '';
  setTimeout(() => { if (!$('sheet').classList.contains('on')) { $('scrim').hidden = true; $('sheet').hidden = true; } }, 300);
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
$('scrim').addEventListener('click', closeSheet);
$('closeBtn').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

function openMod(n) {
  const m = MODS.find(x => x.n === n);
  if (!m) return;
  const shots = m.imgs.map((im, k) => `<img src="${im.src}" width="${im.w}" height="${im.h}" alt="${esc(m.title)} 截圖 ${k + 1}" loading="lazy">`).join('');
  const dls = m.dl.map(([name, href]) => `<div class="row"><span class="ic">${ICON.dl}</span><span class="v"><span><a href="${esc(href)}" target="_blank" rel="noopener">${esc(href.split('/').pop())}</a></span><span class="label">${esc(name)}</span></span><button class="copy" data-copy="${esc(href)}">複製</button></div>`).join('');
  openSheet(`
    <div class="label">第 ${m.page} 頁 · 編號 ${m.n}</div>
    <h3>${esc(m.title)}</h3>
    <div class="shots">${shots}</div>
    <div class="rows">
      <div class="row"><span class="ic">${ICON.user}</span><span class="v"><span>${esc(m.who)}</span><span class="label">角色</span></span></div>
      ${m.note ? `<div class="row"><span class="ic">${ICON.shirt}</span><span class="v"><span>${esc(m.note)}</span><span class="label">說明</span></span></div>` : ''}
      <div class="row"><span class="ic">${ICON.link}</span><span class="v"><span><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url.replace('https://', ''))}</a></span><span class="label">3DM 介紹頁</span></span></div>
    </div>
    <p class="desc">${esc(m.desc)}</p>
    <div class="label">下載連結</div>
    <div class="rows">${dls}</div>
  `, { close: 'back' });
  if (location.hash !== '#' + n) history.replaceState(null, '', '#' + n);
}

document.addEventListener('click', e => {
  const tool = e.target.closest('[data-tool]');
  if (tool) { openTool(+tool.dataset.tool); return; }
  const dup = e.target.closest('.dupbtn');
  if (dup) { openMod(+dup.dataset.n); return; }
  const it = e.target.closest('.item');
  if (it) { const a = ALL.find(x => x.key === it.dataset.key); if (a) a.open(); return; }
  const c = e.target.closest('.copy');
  if (c) {
    const done = () => { c.textContent = '已複製'; setTimeout(() => c.textContent = '複製', 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(c.previousElementSibling.querySelector('a')); getSelection().removeAllRanges(); getSelection().addRange(r); c.textContent = '已選取'; };
    try { navigator.clipboard.writeText(c.dataset.copy).then(done, fallback); } catch (err) { fallback(); }
  }
});

function optsHTML(items, current) {
  return `<div class="opts">${items.map(([val, label, cnt]) => `<button class="opt" data-v="${esc(val)}" aria-pressed="${val == current}"><span class="mark">${val == current ? ICON.check : ''}</span>${esc(label)} <span class="cnt">${cnt}</span></button>`).join('')}</div>`;
}

$('filterBtn').addEventListener('click', () => {
  if (state.view === 'pack') {
    const items = ['全部', ...TOOL_CATS].map(c => [c, c === '全部' ? '所有分類' : c, toolsIn(c).length]).filter(x => x[2]);
    openSheet(`<div class="label">分類</div>${optsHTML(items, state.toolCat)}`);
    $('sheetBody').onclick = e => { const o = e.target.closest('.opt'); if (o) { state.toolCat = o.dataset.v; save(); renderPack(); closeSheet(); window.scrollTo({ top: $('pack').offsetTop - 80 }); } };
    return;
  }
  const items = ['全部', ...CHARS].map(w => [w, w === '全部' ? '所有角色' : w, ALL.filter(a => matchWho(a, w)).length]).filter(x => x[2]);
  openSheet(`<div class="label">角色</div>${optsHTML(items, state.who)}`);
  $('sheetBody').onclick = e => { const o = e.target.closest('.opt'); if (o) { state.who = o.dataset.v; save(); render(); closeSheet(); } };
});
$('pageBtn').addEventListener('click', () => {
  const items = SOURCES.map(s => [s, s === '全部' ? '全部來源' : s === '2026更新' ? '賣家 2026 更新' : s, s === '全部' ? ALL.length : ALL.filter(a => a.src === s).length]);
  openSheet(`<div class="label">來源</div>${optsHTML(items, state.src)}`);
  $('sheetBody').onclick = e => { const o = e.target.closest('.opt'); if (o) { state.src = o.dataset.v; save(); render(); closeSheet(); window.scrollTo({ top: $('list').offsetTop - 80 }); } };
});
$('searchBtn').addEventListener('click', () => {
  openSheet(`<h3>搜尋</h3><div class="results" id="results"></div>`, {
    full: true, close: 'back',
    extra: `<label class="search"><input id="q" type="search" placeholder="輸入服裝、角色、工具名稱" autocomplete="off">${ICON.back.replace('M15 5l-7 7 7 7', 'M11 4.5a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13M16 16l4.5 4.5')}</label>`
  });
  $('sheetBody').onclick = null;
  const q = $('q');
  q.addEventListener('input', () => {
    const k = q.value.trim();
    const hits = k ? ALL.filter(a => (a.title + a.who.join('') + a.slot + a.src).includes(k)) : [];
    const th = k ? TOOLS.filter(t => (t.title + t.cat + (t.flag || '') + t.sources.map(s => s.name).join('')).toLowerCase().includes(k.toLowerCase())) : [];
    $('results').innerHTML = k ? ((th.length ? `<div class="pagehead">存檔與工具 · ${th.length}</div>${th.map(toolHTML).join('')}` : '') + (hits.length ? `<div class="pagehead">服裝 · ${hits.length}</div>${hits.map(itemHTML).join('')}` : '') || '<div class="empty">找不到符合的項目</div>') : '';
  });
  setTimeout(() => q.focus(), 320);
});
$('infoBtn').addEventListener('click', () => {
  openSheet(`<h3>安裝方式</h3>
    <ol class="install">
      <li>下載 MOD 檔案並解壓縮。</li>
      <li>放到遊戲資料夾 <code>\\Steam\\steamapps\\common\\Expedition 33\\Sandfall\\Content\\Paks\\~mods</code>，沒有 <code>~mods</code> 資料夾就自己建一個。</li>
      <li>啟動遊戲。</li>
    </ol>
    <p class="desc">另一種方式：用 Gloss Mod Manager 管理器，選擇《光與影：33 號遠征隊》後把 MOD 拖進去、勾選啟用。</p>
    <p class="desc">資料來源：3DM 服裝 MOD 大全 ${MODS.length} 個、整合包 2.1 的 ${P2.costumes.length} 套、賣家雲端 2026 更新 ${SELLER.length} 套，共 ${ALL.length} 個，依角色分類。服裝依角色、再依替換的服裝部位排列；同一個部位標示「一次只能裝一個」的，代表那幾個 MOD 換的是同一件衣服。</p>`);
  $('sheetBody').onclick = null;
});

setView(state.view === 'pack' ? 'pack' : 'mods');
showHero(0);
restartHero();
const h = location.hash.slice(1);
const ha = ALL.find(a => a.key === h);
if (ha) ha.open();
</script>

</html>
